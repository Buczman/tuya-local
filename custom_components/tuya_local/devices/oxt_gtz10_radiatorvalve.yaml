name: Radiator valve
products:
  - id: pbo8cj0z
    manufacturer: OXT
    model: GTZ10
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 4
        type: integer
        name: temperature
        unit: C
        mapping:
          - scale: 10
            step: 5
        range:
          min: 50
          max: 400
      - id: 5
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 49
        type: string
        name: hvac_action
        optional: true
        mapping:
          - dps_val: opened
            value: heating
          - dps_val: opening
            value: heating
          - dps_val: closed
            value: idle
          - dps_val: closing
            value: idle
  - entity: sensor
    name: Valve opening
    icon: "mdi:valve"
    dps:
      - id: 115
        type: integer
        name: sensor
        optional: true
        unit: "%"
        class: measurement
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 6
        type: integer
        name: sensor
        optional: true
        unit: "%"
        class: measurement
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
        optional: true
  - entity: switch
    name: Open window detection
    icon: "mdi:window-open-variant"
    category: config
    dps:
      - id: 14
        type: boolean
        name: switch
        optional: true
